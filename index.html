<style>
/* ============ 主题变量：想换配色只改这里 ============ */
:root {
  --bg:          #14102b;   /* 页面底色：深靛蓝，比纯紫柔和 */
  --header-a:    #3d2b9e;   /* 头部渐变 起 */
  --header-b:    #6d3ef0;   /* 头部渐变 止 */
  --card-a:      #0f766e;   /* 健身大卡渐变 起（青绿） */
  --card-b:      #0d9488;   /* 健身大卡渐变 止 */
  --card2-a:     #fef3c7;   /* 小卡渐变 起 */
  --card2-b:     #fcd9a0;   /* 小卡渐变 止 */
  --ink:         #f4f2ff;   /* 深底上的主文字 */
  --ink-dim:     #c9c3e8;   /* 深底上的次级文字 */
  --ink-dark:    #1c1917;   /* 亮卡上的主文字 */
  --ink-dark-2:  #4a423a;   /* 亮卡上的次级文字 */
  --radius:      18px;
  --gap:         14px;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 16px;
  overflow-x: hidden;   /* 防横向溢出 */
  background:
    radial-gradient(900px 500px at 15% -10%, #2a1f6b 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #3a1d5e 0%, transparent 55%),
    var(--bg);
  color: var(--ink);
  font-family: "Lora", "LXGW WenKai", "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
}

h1, h2, h3, p { margin: 0; }

/* ============================================================
   和dalang一起听歌 按钮（配色沿用站点青绿主色）
   ============================================================ */
.listen-btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  align-self: flex-start;   /* 不撑满整行 */
  margin-top: 4px;
  padding: 10px 20px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #0f766e, #0d9488);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(13, 148, 136, .35);
  transition: transform .22s cubic-bezier(.2, .7, .3, 1),
              box-shadow .22s ease,
              background .22s ease;
}

.listen-btn:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 10px 24px rgba(13, 148, 136, .5);
}

.listen-btn:active { transform: translateY(0) scale(.99); }

.listen-btn .ico { width: 17px; height: 17px; flex: 0 0 auto; }

/* 播放中：变暗，文字由脚本改成「停止听歌」 */
.listen-btn.is-playing {
  background: linear-gradient(135deg, #3a3a4a, #2a2a36);
  box-shadow: none;
  color: #ddd;
}

/* 中文长串/长网址安全换行 */
.block p, .headstyle .text > p { overflow-wrap: break-word; word-break: break-word; }

/* ============ 头部：左边挂友链，右边是标题 ============ */
.headstyle {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 20px;
  padding: 24px 26px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--header-a), var(--header-b));
  box-shadow: 0 12px 34px rgba(0, 0, 0, .35);
}

/* —— 左栏：头像 + 友链 —— */
.head-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  flex: 0 0 auto;
  padding-right: 20px;
  border-right: 1px solid rgba(255, 255, 255, .18); /* 与标题区分隔 */
}

.headstyle .avatar {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  border: 4px solid rgba(255, 255, 255, .9);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
}

/* —— 友链区：图片超链接 —— */
.friend-links {
  display: grid;
  grid-template-columns: repeat(2, 44px);
  gap: 10px;
  justify-content: center;
}

/* ============================================================
   友链悬停动画
   关键：transition 写在基础状态里（不是 :hover 里），
   这样鼠标「进入」和「移开」都会平滑过渡；
   只写在 :hover 里的话，移开时会瞬间跳回去，等于没有动画。
   ============================================================ */
.friend-links a {
  display: block;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(255, 255, 255, .12);
  border: 1px solid rgba(255, 255, 255, .28);
  /* 进入 + 移开都走这条过渡 */
  transition: transform .22s cubic-bezier(.2, .7, .3, 1),
              box-shadow .22s ease,
              border-color .22s ease;
}

.friend-links a:hover {
  transform: translateY(-6px) scale(1.08);
  box-shadow: 0 12px 22px rgba(0, 0, 0, .45),
              0 0 0 3px rgba(121, 184, 243, .55);
  border-color: #fff;
}

/* 键盘 Tab 聚焦时给同样反馈（无障碍） */
.friend-links a:focus-visible {
  outline: none;
  transform: translateY(-6px) scale(1.08);
  box-shadow: 0 12px 22px rgba(0, 0, 0, .45),
              0 0 0 3px rgba(121, 184, 243, .8);
  border-color: #fff;
}

.friend-links a img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.friend-links-title {
  font-size: 12px;
  letter-spacing: .12em;
  color: var(--ink-dim);
  text-align: center;
}

/* —— 右栏：标题 + 简介 —— */
.headstyle .text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  min-width: 0;
}

.headstyle h1 {
  font-size: clamp(30px, 4vw, 46px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: .01em;
  text-shadow: 0 2px 12px rgba(0, 0, 0, .25);
}

.headstyle .text > p {
  color: var(--ink-dim);
  font-size: 15px;
  letter-spacing: .03em;
  line-height: 1.65;
  max-width: 560px;
}

/* ============ 主体两栏 ============ */
.content {
  display: flex;
  flex-direction: row;
  gap: var(--gap);
  margin-top: var(--gap);
  width: 100%;
}

.block {
  border-radius: var(--radius);
  padding: 22px 22px 26px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
  min-width: 0;
  border: 1px solid rgba(255, 255, 255, .10);
  transition: transform .2s ease, box-shadow .2s ease;
}

.block:hover {
  transform: translateY(-3px);
  box-shadow: 0 16px 36px rgba(0, 0, 0, .38);
}

/* 左边大块：青绿渐变 + 浅色文字 */
.block.big {
  flex: 2;
  min-height: 400px;
  background: linear-gradient(150deg, var(--card-a), var(--card-b));
  color: var(--ink);
  display: flex;
  flex-direction: column;
}


/* 右边一列 */
.right-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  min-width: 0;
}

/* 右边两个小块：亮色卡 + 深色文字 */
.block.small {
  flex: 1;
  background: linear-gradient(150deg, var(--card2-a), var(--card2-b));
  color: var(--ink-dark);
}

.block h2 {
  font-size: clamp(22px, 2.4vw, 32px);
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 10px;
}

.block p {
  font-size: 16px;
  line-height: 1.7;
  margin: 8px 0 0;
}

.block.big p { color: #d8fbf5; }
.block.small p { color: var(--ink-dark-2); }

/* ============================================================
   哑铃图片链接：悬停时脉冲发光
   （transform 过渡 + 逐帧动画可以同时用，互不冲突）
   ============================================================ */
@keyframes gymGlow {
  0%, 100% { box-shadow: 0 0 0 3px rgba(94, 234, 212, .65), 0 8px 18px rgba(0, 0, 0, .35); }
  50%      { box-shadow: 0 0 0 10px rgba(94, 234, 212, .12), 0 8px 18px rgba(0, 0, 0, .35); }
}

.block.big a img {
  display: block;
  width: 250px;
  height: 250px;
  margin-top: 16px;
  border-radius: 12px;
  transition: transform .22s cubic-bezier(.2, .7, .3, 1);
}

.block.big a:hover img {
  transform: scale(1.05) translateY(-4px);
  animation: gymGlow 1.5s ease-in-out infinite;
}

/* ============ 响应式（这一整段必须完整闭合） ============ */
@media (max-width: 768px) {
  body { padding: 12px; }
  .content { flex-direction: column; }

  /* 手机上：左栏改为上下堆叠，避免头像+友链并排导致横向溢出 */
  .headstyle {
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 22px 16px;
    gap: 14px;
  }

  .head-left {
    flex-direction: column;
    width: 100%;
    justify-content: center;
    gap: 10px;
    padding-right: 0;
    padding-bottom: 14px;
    border-right: none;
    border-bottom: 1px solid rgba(255, 255, 255, .18);
  }

  .headstyle .avatar { width: 88px; height: 88px; }

  /* 友链改为可换行的横向排列，图标多也不会溢出 */
  .friend-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 100%;
  }

  /* 标题与简介居中，并留出左右安全边距 */
  .headstyle .text { align-items: center; text-align: center; width: 100%; padding: 0 4px; }
  .headstyle .text > p { max-width: 100%; }
}

/* ============================================================
   正文里的文字链接：下划线从中间展开
   （想用的话，给 <a> 加 class="textlink" 即可）
   ============================================================ */
.textlink {
  color: #8be9d0;
  text-decoration: none;
  position: relative;
  padding-bottom: 2px;
}

.textlink::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 0;
  height: 2px;
  background: currentColor;
  transition: width .3s ease, left .3s ease;
}

.textlink:hover { color: #eafff9; }
.textlink:hover::after { width: 100%; left: 0; }

/* ============================================================
   尊重系统「减少动态效果」设置（无障碍，做动画时建议都加上）
   ============================================================ */
/* ============================================================
   页面加载器（点击链接后出现：转圈 + 顶部进度条 + 遮罩）
   ============================================================ */
#page-loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  background: rgba(20, 16, 43, .74);
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .18s ease, visibility .18s ease;
}

#page-loader.show { opacity: 1; visibility: visible; }

/* 转圈：用 conic-gradient 做渐变环 + 遮罩挖空中心 */
.spinner {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0deg, #5eead4 130deg, #a78bfa 260deg, #f0abfc 360deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px));
  animation: spin .85s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loader-text {
  position: absolute;
  margin-top: 104px;
  color: var(--ink-dim);
  font-size: 13px;
  letter-spacing: .1em;
  animation: breathe 1.4s ease-in-out infinite;
}

@keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

/* 顶部进度条：点击后先冲到 85%，真正跳转时补满，视觉上不"卡" */
#page-progress {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  width: 0;
  z-index: 10000;
  background: linear-gradient(90deg, #5eead4, #a78bfa, #f0abfc);
  box-shadow: 0 0 12px rgba(167, 139, 250, .75);
  opacity: 0;
  transition: width .45s ease, opacity .2s ease;
}

#page-progress.show { opacity: 1; }

/* 避免加载时重复点击 / 页面横向抖动 */
html.is-loading { overflow: hidden; }

/* ============================================================
   悬停气泡（tooltip）：鼠标停在元素上显示文字
   ------------------------------------------------------------
   用法：给任意元素加 class="tip" 和 data-tip="要显示的文字"
       <a class="tip" data-tip="miso" href="...">...</a>

   三句关键：
     content:attr(data-tip)      文字取自 data-tip 属性
     opacity + visibility        控制显隐（visibility 才能真正不挡鼠标）
     pointer-events:none         气泡本身不接收鼠标事件，否则会闪烁
   ============================================================ */
.tip { position: relative; }

.tip::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 10px);
  transform: translate(-50%, 4px);
  background: rgba(12, 12, 20, .96);
  color: #fff;
  padding: 6px 11px;
  border-radius: 8px;
  font-size: 12.5px;
  line-height: 1.4;
  white-space: nowrap;
  border: 1px solid rgba(255, 255, 255, .22);
  box-shadow: 0 8px 20px rgba(0, 0, 0, .5);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;      /* 关键：否则鼠标会被气泡挡住导致闪烁 */
  transition: opacity .18s ease, transform .18s ease, visibility .18s;
  z-index: 60;
}

/* 小三角 */
.tip::before {
  content: "";
  position: absolute;
  left: 50%;
  bottom: calc(100% + 4px);
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: rgba(12, 12, 20, .96);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .18s ease, visibility .18s;
  z-index: 61;
}

.tip:hover::after,
.tip:focus-visible::after {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

.tip:hover::before,
.tip:focus-visible::before {
  opacity: 1;
  visibility: visible;
}

/* 元素贴近页面顶部时，用这个让气泡朝下，避免超出屏幕 */
.tip-bottom::after {
  bottom: auto;
  top: calc(100% + 10px);
  transform: translate(-50%, -4px);
}
.tip-bottom:hover::after,
.tip-bottom:focus-visible::after { transform: translate(-50%, 0); }

.tip-bottom::before {
  bottom: auto;
  top: calc(100% + 4px);
  border-top-color: transparent;
  border-bottom-color: rgba(12, 12, 20, .96);
}

/* 尊重「减少动态效果」：不转圈，只留遮罩与文字 */
@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
  .loader-text { animation: none; }
  #page-progress { transition: opacity .2s ease; }

  /* 链接悬停动画同步关闭 */
  .friend-links a,
  .block.big a img,
  .textlink::after,
  .tip::after,
  .tip::before { transition: none; }

  .friend-links a:hover { transform: none; }
  .listen-btn:hover { transform: none; }

  .block.big a:hover img {
    transform: none;
    animation: none;
  }
}
</style>
</head>

<script>
(function () {
  var loader   = document.getElementById('page-loader');
  var progress = document.getElementById('page-progress');
  var textEl   = loader.querySelector('.loader-text');

  var isShowing = false;
  var autoReset = null;   // 兜底定时器：外部站点打不开时，别让加载器一直转

  function show(label) {
    // 关键：先清掉上一轮遗留的兜底/自动收尾定时器。
    // 放在 isShowing 判断之前——否则新一轮会继承旧定时器，
    // 转圈会被上一轮的计时提前收掉。
    clearTimeout(autoReset);
    autoReset = null;

    if (isShowing) return;
    isShowing = true;

    if (label) textEl.textContent = label;

    loader.classList.add('show');
    progress.classList.add('show');
    document.documentElement.classList.add('is-loading');

    // 两段式进度条：先冲到 85%，剩下的等真正跳转时补满
    requestAnimationFrame(function () {
      progress.style.width = '85%';
    });
  }

  // 收掉加载器并把进度条复位（供兜底逻辑和后退恢复使用）
  function reset() {
    clearTimeout(autoReset);
    progress.style.width = '100%';

    setTimeout(function () {
      loader.classList.remove('show');
      document.documentElement.classList.remove('is-loading');

      setTimeout(function () {
        progress.classList.remove('show');
        progress.style.transition = 'none';
        progress.style.width = '0';
        requestAnimationFrame(function () {
          progress.style.transition = '';
        });
        isShowing = false;
      }, 240);
    }, 180);
  }

  // 后退/前进从浏览器缓存恢复时，把状态清干净
  window.addEventListener('pageshow', function (e) {
    clearTimeout(autoReset);
    isShowing = false;
    loader.classList.remove('show');
    progress.classList.remove('show');
    progress.style.width = '0';
    document.documentElement.classList.remove('is-loading');
    if (e.persisted) {
      // 从 bfcache 恢复，稍等一拍再收尾，避免闪烁
      setTimeout(function () { progress.style.width = '0'; }, 0);
    }
  });

  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a') : null;
    if (!a) return;

    var href = a.getAttribute('href') || '';

    // 跳过：空链接、页内锚点、javascript:、下载、新标签打开、修饰键点击
    if (!href || href.charAt(0) === '#' || href.indexOf('javascript:') === 0) return;
    if (a.hasAttribute('download')) return;
    if (a.dataset.newtab !== undefined || a.target === '_blank') return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;

    var isExternal = /^https?:\/\//i.test(href);

    show(isExternal ? '正在前往友链…' : '正在进入站内页面…');

    if (isExternal) {
      // 外部站点：加载时间不可控，先让动画显示 300ms，再放行跳转
      e.preventDefault();
      var target = a.href;
      autoReset = setTimeout(function () {
        // 兜底：对方站点打不开时，6 秒后收掉加载器，避免一直转圈
        reset();
      }, 6000);

      setTimeout(function () {
        clearTimeout(autoReset);
        window.location.href = target;
      }, 300);
      return;
    }

    // 站内跳转：不做拦截，交给浏览器正常导航。
    // 本页卸载前加载器会一直显示，正好盖住新页面的白屏。
  });

  // 站内跳转时把进度条补满，视觉上收尾
  window.addEventListener('beforeunload', function () {
    if (isShowing) progress.style.width = '100%';
  });
})();
</script>

<!-- ==================== 听歌按钮接线 ==================== -->
<script>
(function () {
  var btn     = document.getElementById('listenBtn');
  var btnText = document.getElementById('listenBtnText');
  if (!btn) return;

  btn.addEventListener('click', function () {
    // 已在放歌 → 暂停/继续；没放过 → 从第 1 首开始
    window.musicPlayer.start();
  });

  // 播放状态变化 → 同步按钮文字与样式
  document.addEventListener('musicstatechange', function (e) {
    var d = e.detail || {};
    btn.classList.toggle('is-playing', !!d.playing);
    btnText.textContent = d.playing ? '停止听歌' : '和dalang一起听歌';
  });
})();
</script>
