<style>

/* ============ 主题变量：想换配色只改这里 ============ */
:root {
  --bg:          #14102b;   /* 页面底色：深靛蓝，比纯紫柔和 */
  --header-a:    #3d2b9e;   /* 头部渐变 起 */
  --header-b:    #6d3ef0;   /* 头部渐变 止 */
  --card-a:      #0f766e;   /* 健身大卡渐变 起（青绿） */
  --card-b:      #0d9488;   /* 健身大卡渐变 止 */
  --card2-a:     #fef3c7;   /* 小卡渐变 起 */
  --card2-b:     #fcd9a0;   /* 小卡渐变 止 */
  --ink:         #f4f2ff;   /* 深底上的主文字 */
  --ink-dim:     #c9c3e8;   /* 深底上的次级文字 */
  --ink-dark:    #1c1917;   /* 亮卡上的主文字 */
  --ink-dark-2:  #4a423a;   /* 亮卡上的次级文字 */
  --radius:      18px;
  --gap:         14px;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 16px;
  overflow-x: hidden;   /* 防横向溢出 */
  background:
    radial-gradient(900px 500px at 15% -10%, #2a1f6b 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #3a1d5e 0%, transparent 55%),
    var(--bg);
  color: var(--ink);
  font-family: "Lora", "LXGW WenKai", "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
}

h1, h2, h3, p { margin: 0; }

/* 中文长串/长网址安全换行 */
.block p, .headstyle .text > p { overflow-wrap: break-word; word-break: break-word; }

/* ============ 头部：左边挂友链，右边是标题 ============ */
.headstyle {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 20px;
  padding: 24px 26px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--header-a), var(--header-b));
  box-shadow: 0 12px 34px rgba(0, 0, 0, .35);
}

/* —— 左栏：头像 + 友链 —— */
.head-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  flex: 0 0 auto;
  padding-right: 20px;
  border-right: 1px solid rgba(255, 255, 255, .18); /* 与标题区分隔 */
}

.headstyle .avatar {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  border: 4px solid rgba(255, 255, 255, .9);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
}

/* —— 友链区：图片超链接 —— */
.friend-links {
  display: grid;
  grid-template-columns: repeat(2, 44px);
  gap: 10px;
  justify-content: center;
}

.friend-links a {
  display: block;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(255, 255, 255, .12);
  border: 1px solid rgba(255, 255, 255, .28);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}

.friend-links a:hover {
  transform: translateY(-3px) scale(1.06);
  box-shadow: 0 8px 18px rgba(0, 0, 0, .4);
  border-color: rgba(255, 255, 255, .8);
}

.friend-links a img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.friend-links-title {
  font-size: 12px;
  letter-spacing: .12em;
  color: var(--ink-dim);
  text-align: center;
}

/* —— 右栏：标题 + 简介 —— */
.headstyle .text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  min-width: 0;
}

.headstyle h1 {
  font-size: clamp(30px, 4vw, 46px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: .01em;
  text-shadow: 0 2px 12px rgba(0, 0, 0, .25);
}

.headstyle .text > p {
  color: var(--ink-dim);
  font-size: 15px;
  letter-spacing: .03em;
  line-height: 1.65;
  max-width: 560px;
}

/* ============ 主体两栏 ============ */
.content {
  display: flex;
  flex-direction: row;
  gap: var(--gap);
  margin-top: var(--gap);
  width: 100%;
}

.block {
  border-radius: var(--radius);
  padding: 22px 22px 26px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
  min-width: 0;
  border: 1px solid rgba(255, 255, 255, .10);
  transition: transform .2s ease, box-shadow .2s ease;
}

.block:hover {
  transform: translateY(-3px);
  box-shadow: 0 16px 36px rgba(0, 0, 0, .38);
}

/* 左边大块：青绿渐变 + 浅色文字 */
.block.big {
  flex: 2;
  min-height: 400px;
  background: linear-gradient(150deg, var(--card-a), var(--card-b));
  color: var(--ink);
  display: flex;
  flex-direction: column;
}

/* 右边一列 */
.right-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  min-width: 0;
}

/* 右边两个小块：亮色卡 + 深色文字 */
.block.small {
  flex: 1;
  background: linear-gradient(150deg, var(--card2-a), var(--card2-b));
  color: var(--ink-dark);
}

.block h2 {
  font-size: clamp(22px, 2.4vw, 32px);
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 10px;
}

.block p {
  font-size: 16px;
  line-height: 1.7;
  margin: 8px 0 0;
}

.block.big p { color: #d8fbf5; }
.block.small p { color: var(--ink-dark-2); }

/* 哑铃图片链接 */
.block.big a img {
  display: block;
  max-width: 100%;
  width: auto;
  height: auto;
  margin-top: 16px;
  border-radius: 12px;
  transition: transform .2s ease;
}

.block.big a img:hover { transform: scale(1.04); }

/* ============ 响应式（这一整段必须完整闭合） ============ */
@media (max-width: 768px) {
  body { padding: 12px; }
  .content { flex-direction: column; }

  /* 手机上：左栏改为上下堆叠，避免头像+友链并排导致横向溢出 */
  .headstyle {
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 22px 16px;
    gap: 14px;
  }

  .head-left {
    flex-direction: column;
    width: 100%;
    justify-content: center;
    gap: 10px;
    padding-right: 0;
    padding-bottom: 14px;
    border-right: none;
    border-bottom: 1px solid rgba(255, 255, 255, .18);
  }

  .headstyle .avatar { width: 88px; height: 88px; }

  /* 友链改为可换行的横向排列，图标多也不会溢出 */
  .friend-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 100%;
  }

  /* 标题与简介居中，并留出左右安全边距 */
  .headstyle .text { align-items: center; text-align: center; width: 100%; padding: 0 4px; }
  .headstyle .text > p { max-width: 100%; }
}
</style>
</head>
